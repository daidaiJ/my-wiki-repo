<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 748" width="1080" height="748" role="img" aria-labelledby="title desc">
  <title id="title">my-wiki 架构：控制流与数据面分离</title>
  <desc id="desc">Agent 经双 hook 调用 wiki CLI；项目侧窗口链接指向 WIKI_ROOT/projects 真文件；出口为 Obsidian 校对与 Hugo 发布。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1117"/>
      <stop offset="100%" stop-color="#121a24"/>
    </linearGradient>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#5eead4"/>
    </marker>
    <marker id="arrowSand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#f5d0a9"/>
    </marker>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 L9 5 L0 8.8 Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1080" height="748" rx="18" fill="url(#bg)"/>
  <g transform="translate(0,-72)">

  <text x="40" y="104" font-family="Segoe UI, sans-serif" font-size="11" letter-spacing="2.2" fill="#5eead4">01  接入层 · AGENTS</text>

  <rect x="40" y="116" width="320" height="86" rx="12" fill="#16202c" stroke="#2d3f52"/>
  <circle cx="64" cy="144" r="8" fill="#5eead4"/>
  <text x="82" y="149" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#e8eef4">Claude Code</text>
  <text x="82" y="172" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">SessionStart → prepare</text>
  <text x="82" y="190" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">SessionEnd → check</text>

  <rect x="380" y="116" width="320" height="86" rx="12" fill="#16202c" stroke="#2d3f52"/>
  <circle cx="404" cy="144" r="8" fill="#7dd3fc"/>
  <text x="422" y="149" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#e8eef4">ZCode</text>
  <text x="422" y="172" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">Start → prepare</text>
  <text x="422" y="190" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">Stop → check</text>

  <rect x="720" y="116" width="320" height="86" rx="12" fill="#16202c" stroke="#2d3f52"/>
  <circle cx="744" cy="144" r="8" fill="#f5d0a9"/>
  <text x="762" y="149" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600" fill="#e8eef4">Qwen / Codex</text>
  <text x="762" y="172" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">wiki inject 注入规约</text>
  <text x="762" y="190" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">开工 prepare · 收工 check</text>

  <line x1="200" y1="202" x2="200" y2="228" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
  <line x1="540" y1="202" x2="540" y2="228" stroke="#7dd3fc" stroke-width="1.6" marker-end="url(#arrowSky)"/>
  <line x1="880" y1="202" x2="880" y2="228" stroke="#f5d0a9" stroke-width="1.6" marker-end="url(#arrowSand)"/>

  <text x="40" y="250" font-family="Segoe UI, sans-serif" font-size="11" letter-spacing="2.2" fill="#7dd3fc">02  控制面 · wiki CLI（开源，与数据互不污染）</text>
  <rect x="40" y="262" width="1000" height="118" rx="12" fill="#13202d" stroke="#35506a"/>

  <text x="60" y="292" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#7dd3fc">wiki</text>
  <text x="112" y="292" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#8b9bb4">单二进制 · stdout 恒空 · 失败不阻塞会话</text>

  <rect x="60" y="310" width="88" height="26" rx="6" fill="#1e3348" stroke="#3d5a75"/>
  <text x="104" y="328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#c9d7e6">prepare</text>
  <rect x="158" y="310" width="72" height="26" rx="6" fill="#1e3348" stroke="#3d5a75"/>
  <text x="194" y="328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#c9d7e6">check</text>
  <rect x="240" y="310" width="60" height="26" rx="6" fill="#1e3348" stroke="#3d5a75"/>
  <text x="270" y="328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#c9d7e6">init</text>
  <rect x="310" y="310" width="64" height="26" rx="6" fill="#1e3348" stroke="#3d5a75"/>
  <text x="342" y="328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#c9d7e6">grep</text>
  <rect x="384" y="310" width="56" height="26" rx="6" fill="#1e3348" stroke="#3d5a75"/>
  <text x="412" y="328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#c9d7e6">cat</text>
  <rect x="450" y="310" width="92" height="26" rx="6" fill="#1e3348" stroke="#3d5a75"/>
  <text x="496" y="328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#c9d7e6">blog new</text>
  <rect x="552" y="310" width="108" height="26" rx="6" fill="#1e3348" stroke="#3d5a75"/>
  <text x="606" y="328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#c9d7e6">blog publish</text>
  <rect x="670" y="310" width="72" height="26" rx="6" fill="#1e3348" stroke="#3d5a75"/>
  <text x="706" y="328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#c9d7e6">inject</text>
  <rect x="752" y="310" width="80" height="26" rx="6" fill="#1e3348" stroke="#3d5a75"/>
  <text x="792" y="328" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#c9d7e6">bundle</text>

  <text x="60" y="358" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">包：</text>
  <text x="88" y="358" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#5eead4">registry</text>
  <text x="168" y="358" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6d82">接入 / 窗口 / 同步</text>
  <text x="300" y="358" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#7dd3fc">view</text>
  <text x="344" y="358" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6d82">跨项目检索</text>
  <text x="440" y="358" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#f5d0a9">blog</text>
  <text x="484" y="358" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6d82">Hugo 流水线</text>
  <text x="580" y="358" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#c4b5fd">config</text>
  <text x="640" y="358" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6d82">WIKI_ROOT 解析</text>
  <text x="760" y="358" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#fda4af">guide</text>
  <text x="812" y="358" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#5a6d82">规约注入</text>

  <line x1="280" y1="380" x2="280" y2="408" stroke="#5eead4" stroke-width="1.6" marker-end="url(#arrowTeal)"/>
  <line x1="800" y1="380" x2="800" y2="408" stroke="#f5d0a9" stroke-width="1.6" marker-end="url(#arrowSand)"/>

  <text x="40" y="430" font-family="Segoe UI, sans-serif" font-size="11" letter-spacing="2.2" fill="#f5d0a9">03  数据面 · 反转存储：项目窗口 + WIKI_ROOT</text>

  <rect x="40" y="442" width="480" height="210" rx="12" fill="#16202c" stroke="#2d3f52"/>
  <text x="60" y="470" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#e8eef4">项目仓库（窗口）</text>
  <text x="60" y="490" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">agent 仍写 wiki/note.md，路径不变</text>

  <rect x="60" y="508" width="440" height="52" rx="8" fill="#0f1822" stroke="#2d3f52"/>
  <text x="76" y="530" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#c9d7e6">项目A/wiki/</text>
  <text x="76" y="548" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5eead4">link · symlink / junction → 知识库正本</text>

  <rect x="60" y="570" width="440" height="62" rx="8" fill="#0f1822" stroke="#2d3f52"/>
  <text x="76" y="592" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#c9d7e6">项目B/wiki/</text>
  <text x="76" y="610" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#f5d0a9">copy · 真目录归项目 git · mtime 新者胜 · 永不删文件</text>
  <text x="76" y="624" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#5a6d82">.gitignore 仅 link 模式写入知识目录条目</text>

  <rect x="560" y="442" width="480" height="210" rx="12" fill="#1a2218" stroke="#3d5a3a"/>
  <text x="580" y="470" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#e8eef4">WIKI_ROOT（可 git / Obsidian vault）</text>
  <text x="580" y="490" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">环境变量 → exe 目录 → cwd → exe 兜底</text>

  <rect x="580" y="508" width="440" height="36" rx="8" fill="#10180f" stroke="#3d5a3a"/>
  <text x="596" y="531" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#86efac">index.md</text>
  <text x="680" y="531" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">隐藏 JSON 注册表 + Markdown 视图</text>

  <rect x="580" y="552" width="440" height="36" rx="8" fill="#10180f" stroke="#3d5a3a"/>
  <text x="596" y="575" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#86efac">projects/&lt;项目&gt;/</text>
  <text x="760" y="575" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">知识正文真文件</text>

  <rect x="580" y="596" width="210" height="36" rx="8" fill="#10180f" stroke="#3d5a3a"/>
  <text x="596" y="619" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#86efac">config.json</text>
  <rect x="800" y="596" width="220" height="36" rx="8" fill="#10180f" stroke="#3d5a3a"/>
  <text x="816" y="619" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#86efac">blog.json</text>

  <path d="M520 547 L560 547" stroke="#f5d0a9" stroke-width="1.8" marker-end="url(#arrowSand)"/>
  <text x="540" y="538" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#f5d0a9">写</text>

  <text x="40" y="682" font-family="Segoe UI, sans-serif" font-size="11" letter-spacing="2.2" fill="#c4b5fd">04  两个出口</text>

  <line x1="280" y1="652" x2="200" y2="690" stroke="#c4b5fd" stroke-width="1.4" marker-end="url(#arrowSky)"/>
  <line x1="540" y1="652" x2="540" y2="690" stroke="#7dd3fc" stroke-width="1.4" marker-end="url(#arrowSky)"/>
  <line x1="800" y1="652" x2="880" y2="690" stroke="#f5d0a9" stroke-width="1.4" marker-end="url(#arrowSand)"/>

  <rect x="40" y="698" width="320" height="86" rx="12" fill="#1c1730" stroke="#4c3d72"/>
  <text x="60" y="726" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#c4b5fd">Obsidian 校对</text>
  <text x="60" y="748" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#a78bfa">vault 根 = WIKI_ROOT</text>
  <text x="60" y="766" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">整条链路唯一的人工关卡</text>

  <rect x="380" y="698" width="320" height="86" rx="12" fill="#0f1c28" stroke="#2d4a62"/>
  <text x="400" y="726" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#7dd3fc">git 同步知识库</text>
  <text x="400" y="748" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#67a8c8">projects/ + index.md → private remote</text>
  <text x="400" y="766" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">换机器 clone 后 prepare 重建窗口</text>

  <rect x="720" y="698" width="320" height="86" rx="12" fill="#241c14" stroke="#6b5340"/>
  <text x="740" y="726" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#f5d0a9">Hugo 发布 / 按需归档</text>
  <text x="740" y="748" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#d4a574">blog publish · wiki bundle</text>
  <text x="740" y="766" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b9bb4">push 失败不重试 · bundle 不走 hook</text>
  </g>
</svg>
