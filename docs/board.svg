<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 376" width="1080" height="376" role="img" aria-labelledby="title desc">
  <title id="title">my-wiki 看板：架构 · 自动化 · 能力 · 同步</title>
  <desc id="desc">四列看板，概括数据面与控制流分离、双 hook、跨项目检索与 git 友好同步。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1117"/>
      <stop offset="100%" stop-color="#121a24"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="376" rx="18" fill="url(#bg)"/>
  <g transform="translate(0,-44)">

  <rect x="28" y="64" width="248" height="332" rx="14" fill="#141c26"/>
  <rect x="28" y="64" width="248" height="44" rx="14" fill="#14241f"/>
  <rect x="28" y="92" width="248" height="16" fill="#14241f"/>
  <circle cx="52" cy="86" r="6" fill="#5eead4"/>
  <text x="68" y="91" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#5eead4">架构</text>
  <text x="252" y="91" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" fill="#3d5a52">3</text>

  <rect x="44" y="124" width="216" height="78" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="44" y="124" width="4" height="78" rx="2" fill="#5eead4"/>
  <text x="60" y="150" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">数据面 / 控制流分离</text>
  <text x="60" y="172" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">CLI 可开源升级</text>
  <text x="60" y="188" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">个人数据留在 WIKI_ROOT</text>

  <rect x="44" y="214" width="216" height="78" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="44" y="214" width="4" height="78" rx="2" fill="#5eead4"/>
  <text x="60" y="240" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">反转存储</text>
  <text x="60" y="262" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">projects/ 真文件（正向聚合已退役）</text>
  <text x="60" y="278" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">项目侧窗口，或 copy 增量拷</text>

  <rect x="44" y="304" width="216" height="74" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="44" y="304" width="4" height="74" rx="2" fill="#5eead4"/>
  <text x="60" y="330" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">集中注册表</text>
  <text x="60" y="352" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">index.md 隐藏 JSON</text>
  <text x="60" y="368" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">一份文件同时给人与机器读</text>

  <rect x="288" y="64" width="248" height="332" rx="14" fill="#141c26"/>
  <rect x="288" y="64" width="248" height="44" rx="14" fill="#132230"/>
  <rect x="288" y="92" width="248" height="16" fill="#132230"/>
  <circle cx="312" cy="86" r="6" fill="#7dd3fc"/>
  <text x="328" y="91" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#7dd3fc">自动化</text>
  <text x="512" y="91" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" fill="#3d5568">3</text>

  <rect x="304" y="124" width="216" height="78" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="304" y="124" width="4" height="78" rx="2" fill="#7dd3fc"/>
  <text x="320" y="150" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">开工 wiki prepare</text>
  <text x="320" y="172" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">会话开始 hook</text>
  <text x="320" y="188" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">建立 / 修复窗口链接</text>

  <rect x="304" y="214" width="216" height="78" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="304" y="214" width="4" height="78" rx="2" fill="#7dd3fc"/>
  <text x="320" y="240" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">收工 wiki check</text>
  <text x="320" y="262" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">会话退出 hook</text>
  <text x="320" y="278" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">迁移正文、同步注册表</text>

  <rect x="304" y="304" width="216" height="74" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="304" y="304" width="4" height="74" rx="2" fill="#7dd3fc"/>
  <text x="320" y="330" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">Hook 安全契约</text>
  <text x="320" y="352" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">stdout 恒空 · 日志走 stderr</text>
  <text x="320" y="368" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">内部错误不打断会话</text>

  <rect x="548" y="64" width="248" height="332" rx="14" fill="#141c26"/>
  <rect x="548" y="64" width="248" height="44" rx="14" fill="#241c14"/>
  <rect x="548" y="92" width="248" height="16" fill="#241c14"/>
  <circle cx="572" cy="86" r="6" fill="#f5d0a9"/>
  <text x="588" y="91" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#f5d0a9">能力</text>
  <text x="772" y="91" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" fill="#6b5340">3</text>

  <rect x="564" y="124" width="216" height="78" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="564" y="124" width="4" height="78" rx="2" fill="#f5d0a9"/>
  <text x="580" y="150" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">跨项目 wiki grep</text>
  <text x="580" y="172" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">路径规格 项目/链接/文件</text>
  <text x="580" y="188" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">命中可直接喂给 wiki cat</text>

  <rect x="564" y="214" width="216" height="78" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="564" y="214" width="4" height="78" rx="2" fill="#f5d0a9"/>
  <text x="580" y="240" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">Obsidian 直读</text>
  <text x="580" y="262" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">projects/ 下是真文件</text>
  <text x="580" y="278" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">无需再走一层符号链接</text>

  <rect x="564" y="304" width="216" height="74" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="564" y="304" width="4" height="74" rx="2" fill="#f5d0a9"/>
  <text x="580" y="330" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">Hugo 发布流水线</text>
  <text x="580" y="352" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">查重 · archetype · 四字段</text>
  <text x="580" y="368" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">publish = push 成功</text>

  <rect x="808" y="64" width="244" height="332" rx="14" fill="#141c26"/>
  <rect x="808" y="64" width="244" height="44" rx="14" fill="#1c1730"/>
  <rect x="808" y="92" width="244" height="16" fill="#1c1730"/>
  <circle cx="832" cy="86" r="6" fill="#c4b5fd"/>
  <text x="848" y="91" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#c4b5fd">同步</text>
  <text x="1028" y="91" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" fill="#4c3d72">3</text>

  <rect x="824" y="124" width="212" height="78" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="824" y="124" width="4" height="78" rx="2" fill="#c4b5fd"/>
  <text x="840" y="150" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">Git 友好正文</text>
  <text x="840" y="172" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">真文件进知识库仓</text>
  <text x="840" y="188" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">工具从不自动 push</text>

  <rect x="824" y="214" width="212" height="78" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="824" y="214" width="4" height="78" rx="2" fill="#c4b5fd"/>
  <text x="840" y="240" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">按需归档 · bundle</text>
  <text x="840" y="262" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">按需克隆 / zip / tgz</text>
  <text x="840" y="278" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">不是日常布局，是备份出口</text>

  <rect x="824" y="304" width="212" height="74" rx="10" fill="#1a2734" stroke="#2d3f52"/>
  <rect x="824" y="304" width="4" height="74" rx="2" fill="#c4b5fd"/>
  <text x="840" y="330" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#e8eef4">防误提交</text>
  <text x="840" y="352" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">projectGitignore 默认开</text>
  <text x="840" y="368" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b9bb4">个人配置不进项目 remote</text>
  </g>
</svg>
